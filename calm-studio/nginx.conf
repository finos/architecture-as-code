server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Subpath build (Hub gateway, BASE_PATH=/studio). Canonical URL keeps the slash.
    location = /studio {
        return 301 /studio/;
    }

    location /studio/ {
        try_files $uri $uri/ /studio/index.html;
    }

    # SPA fallback at the site root (standalone image).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# @azure/msal-node 6.0.1 comes in only through @azure/identity under @vscode/vsce, which
# packages and publishes the VS Code extension. The fix is in 7.1.0, and @azure/identity
# 4.14.0 (latest) still requires ^6.0.0. The release job publishes with VSCE_PAT, and the
# credential chain behind vsce --azure-credential has no authorization code flow.
[[IgnoredVulns]]
id = "GHSA-xcx6-jx8p-x3h5"
ignoreUntil = 2026-12-31
reason = "@azure/msal-node 6.0.1 is used only by vsce through @azure/identity. CI publishes with a PAT, and vsce's --azure-credential chain has no authorization code flow. Not shipped. Remove when @azure/identity accepts @azure/msal-node >= 7.1.0."

# @sveltejs/kit 2.70.2 comes in only through the CALM Studio app (calm-studio/apps/studio).
# It is a single-page app built with adapter-static: ssr = false, prerender = false, an
# index.html fallback, only the root route, and no server routes, form actions or setHeaders
# calls. Both advisories need one of those features. The fix is only in kit 3, which needs
# TypeScript 6, and CALM Studio is to be retired.
[[IgnoredVulns]]
id = "GHSA-27mw-82g8-phjj"
ignoreUntil = 2026-12-31
reason = "@sveltejs/kit 2.70.2 is used only by CALM Studio, a single-page app with prerender = false. It prerenders no pages and never calls setHeaders, so an untrusted cache-control header cannot reach a prerendered page. Remove when CALM Studio is retired or moves to kit 3."

[[IgnoredVulns]]
id = "GHSA-pfhg-q3qv-9q6r"
ignoreUntil = 2026-12-31
reason = "@sveltejs/kit 2.70.2 is used only by CALM Studio, a single-page app with only the root route, no form actions and no use:enhance, so the enhanced form redirect cannot occur. Remove when CALM Studio is retired or moves to kit 3."

# deepmerge 4.3.1 comes in through @sveltejs/vite-plugin-svelte (CALM Studio app and
# @calmstudio/diagram) and @svgr/plugin-svgo (Docusaurus preset-classic in docs). Both are
# build-time only. vite-plugin-svelte merges our own Svelte and Vite config with it, and
# plugin-svgo declares it but never imports it. No patched release exists, and the latest
# vite-plugin-svelte still depends on it.
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-12-31
reason = "deepmerge 4.3.1 runs only at build time: vite-plugin-svelte merges project-owned Svelte and Vite config, and @svgr/plugin-svgo never imports it. No untrusted object reaches mergeObject(). Remove when a patched release is available."

# opentelemetry-api 1.62.0 comes in through the Quarkus BOM for CALM Hub. The quadratic
# tracestate parsing runs only when the OpenTelemetry SDK is on. CALM Hub turns it off by
# default (CALM_OTEL_DISABLED=true), and then Quarkus does not extract inbound trace context.
# The fix (1.67.0) cannot be overridden: Quarkus 3.40 does not start with OpenTelemetry 1.67.
[[IgnoredVulns]]
id = "GHSA-ccrj-gw8r-854m"
ignoreUntil = 2026-11-30
reason = "CALM Hub turns off the OpenTelemetry SDK by default, and Quarkus then does not parse inbound tracestate headers. Deployments that set CALM_OTEL_DISABLED=false are exposed until Quarkus manages OpenTelemetry >= 1.67.0. Remove when the Quarkus BOM moves to it."

# braces 3.0.3 comes in only through build and dev tooling: micromatch (semantic-release,
# stylelint, eslint-config-next, Docusaurus) and chokidar 3 (Docusaurus and
# webpack-dev-server). Every pattern it expands comes from project or tool config,
# never from user input. No patched braces release exists yet.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-12-31
reason = "braces 3.0.3 is used only by build and dev tooling (semantic-release, stylelint, eslint-config-next, Docusaurus, webpack-dev-server) and only expands patterns from project config, never user input. Remove when a patched braces release is available."

# http-cache-semantics 4.2.0 comes in through make-fetch-happen (the npm CLI bundled with
# semantic-release, and @npmcli/arborist under license-checker-rseidelsohn) and through
# Docusaurus's update-notifier (got, cacheable-request). All use it only as a private
# client cache. The attack needs a shared cache that serves
# responses to other users, which no CALM component runs. No patched release exists yet.
[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-12-31
reason = "http-cache-semantics 4.2.0 is used only as a private client cache by the npm CLI bundled with semantic-release, by license-checker-rseidelsohn and by Docusaurus's update-notifier; no CALM component runs a shared cache. Remove when a patched release is available."

# postcss-selector-parser 6.1.4 comes in through the cssnano plugins that Docusaurus uses
# to minify CSS, and 7.1.4 is bundled inside the npm CLI used by semantic-release. The
# fix is only in 7.1.6: there is no 6.x fix, and overrides cannot reach bundled
# dependencies. Both copies parse only the project's own CSS at build time.
[[IgnoredVulns]]
id = "GHSA-rj75-hqrm-r3gf"
ignoreUntil = 2026-12-31
reason = "postcss-selector-parser 6.1.4 (cssnano under Docusaurus) and 7.1.4 (bundled in the npm CLI used by semantic-release) parse only the project's own CSS at build time, so an attacker cannot supply the selectors that cause the slow parse. Not shipped. Remove when cssnano moves to 7.1.6 and npm bundles 7.1.6."

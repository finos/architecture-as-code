# Suppressions for the OSV Scanner workflow (.github/workflows/osv-scanner.yml).
# A maintainer may add an entry only when the finding is non-exploitable in this
# project. Each entry must give the justification in `reason` and an `ignoreUntil`
# date for re-review. See SECURITY.md, "Dependency and Code Scanning Policy".

# glib 0.18 comes in through Tauri's Linux GTK stack for the CALM Studio desktop app.
# The unsound iterator impls on glib::VariantStrIter are not called by CALM Studio code,
# and the fix (glib 0.20) needs a Tauri release that moves to gtk-rs 0.20.
[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2026-12-31
reason = "glib 0.18 is pinned by Tauri's GTK stack; the unsound VariantStrIter impls are not used by CALM Studio. Re-check when Tauri supports gtk-rs 0.20."

# npm bundles its own copies of these packages inside the npm CLI, which semantic-release
# uses at release time. They are dev-only, never shipped, and npm overrides cannot reach
# bundled dependencies. No npm release (11.20.0, 12.1.0) bundles fixed versions yet.
# The versions are pinned, so another copy of the package in the tree is still scanned.
[[PackageOverrides]]
name = "ip-address"
version = "10.5.0"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-30
reason = "Bundled inside the npm CLI used by semantic-release at release time; dev-only and not shipped. Remove when npm bundles ip-address >= 10.7.2."

[[PackageOverrides]]
name = "undici"
version = "6.28.0"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2026-11-30
reason = "Bundled inside the npm CLI used by semantic-release at release time; dev-only and not shipped. Remove when npm bundles a fixed undici."

# Suppressions for the OSV Scanner workflow (.github/workflows/osv-scanner.yml).
# A maintainer may add an entry only when the finding is non-exploitable in this
# project. Each entry must give the justification in `reason` and an `ignoreUntil`
# date for re-review. See SECURITY.md, "Dependency and Code Scanning Policy".
# Every entry must have a matching not_affected statement in vex/calm.openvex.json.
# An ignored ID applies to every copy of the package, so check that the other copies are
# outside the affected range before adding one.

# katex 0.16.47 comes in only through mermaid 11, which pins ^0.16.45. The fix is in
# 0.18.2. mermaid 12.2.0 moves to katex 0.18, but it needs @mermaid-js/layout-elk 1.x,
# and layout-elk 1.0.1 (latest) still depends on katex ^0.16.47 and inlines 0.16.47 in
# its ESM bundle. The only place katex code runs is the CLI `--export-diagrams` renderer,
# which serves the self-contained mermaid and layout-elk ESM bundles with their inlined
# katex copies, so an npm override cannot reach the code that executes. katex loads only
# for math blocks, and the advisory needs an already-polluted Object.prototype plus
# attacker-controlled math input.
[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2027-03-31
reason = "katex is reachable only through the inlined copies in the CLI diagram renderer's mermaid and layout-elk bundles, and only when a mermaid diagram contains math. The read-side gadget needs an already-polluted Object.prototype, which no CALM component provides. Remove when the CLI moves to mermaid >= 12.2.0 and a layout-elk release that uses katex >= 0.18.2."

# ip-address 10.7.2 is bundled inside npm 11.21.1, which comes in only through
# @semantic-release/npm for the CLI release job. npm overrides cannot change a bundled
# dependency, and no npm release bundles the fix (10.7.4) yet: 12.2.1 also bundles 10.7.2.
# The other copy in the lockfile is already 10.7.4. npm parses only registry and proxy
# hosts from its own config.
[[IgnoredVulns]]
id = "GHSA-rxp7-6hxx-x8q5"
ignoreUntil = 2027-03-31
reason = "ip-address 10.7.2 is bundled in npm under @semantic-release/npm, used only by the CLI release job; it parses only registry and proxy hosts from CI config, never user input. Not shipped. Remove when an npm release bundles ip-address >= 10.7.4."


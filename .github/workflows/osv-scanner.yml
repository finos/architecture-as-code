name: OSV Scanner

# Software composition analysis (SCA) for every dependency tree in the repository.
# Runs on every pull request with no path filter so it can be a required status
# check, and needs no secrets so it also runs on pull requests from forks. The
# CLI and CALM Server release workflows require a passing push run for the commit they release.
# See SECURITY.md, "Dependency and Code Scanning Policy".

permissions:
    contents: read

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '0 8,18 * * 1-5'
    workflow_dispatch:

env:
    OSV_SCANNER_VERSION: v2.6.0
    OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    # Findings with a CVSS score at or above this value fail the check.
    CVSS_THRESHOLD: '5'

jobs:
    osv-scanner:
        name: osv-scanner
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install osv-scanner
              run: |
                  curl -fsSL -o osv-scanner \
                    "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
                  echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check
                  chmod +x osv-scanner

            - name: Scan dependencies
              run: |
                  set +e
                  ./osv-scanner scan source \
                    --config osv-scanner.toml \
                    --lockfile package-lock.json \
                    --lockfile calm-studio/apps/studio/src-tauri/Cargo.lock \
                    --lockfile calm-hub/pom.xml \
                    --lockfile calm-models/pom.xml \
                    --format json \
                    --output-file osv-results.json
                  STATUS=$?
                  set -e
                  # 0 = nothing found, 1 = vulnerabilities found; anything else is a scan error.
                  if [ "$STATUS" -gt 1 ]; then
                    echo "❌ osv-scanner failed with exit code $STATUS."
                    exit "$STATUS"
                  fi

            - name: Apply severity threshold
              run: bash scripts/osv-threshold.sh osv-results.json "$CVSS_THRESHOLD"

            - name: Upload results
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: osv-scanner-results
                  path: osv-results.json
                  if-no-files-found: ignore

name: Build Calm Hub with Integration Tests and Coverage

permissions:
    contents: read

on:
    pull_request:
        branches:
            - 'main'
            - 'release*'
    push:
        branches:
            - 'main'
            - 'release*'

jobs:
    build:
        name: Build Calm Hub
        runs-on: ubuntu-latest

        steps:
            # Step 1: Checkout PR Branch
            - name: Checkout PR Branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Seed $id base follows -u. No running Hub is required.
            - name: Check init-nitrite seed base URL
              run: bash calm-hub/nitrite/test-init-nitrite-base-url.sh

            # Step 2: Set up JDK
            - name: Set up JDK
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            # Step 3: Cache Maven Dependencies
            - name: Cache Maven Dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.m2
                  # This build saves the cache that the coverage and image builds restore. It resolves all that
                  # they resolve. An exact hit is not saved again, so a build that resolves less must not save it.
                  key: ${{ runner.os }}-m2-calm-hub-integration-${{ hashFiles('pom.xml', 'calm-hub/pom.xml') }}
                  restore-keys: |
                      ${{ runner.os }}-m2-calm-hub-integration-
                      ${{ runner.os }}-m2-

            # Step 4: Set up Docker (Required for Testcontainers)
            - name: Set up Docker
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            # Step 5: Build and Test
            - name: Build and Test
              working-directory: calm-hub
              run: mvn -P integration clean verify

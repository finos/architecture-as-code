name: Build CALM Diagram

permissions:
    contents: read

on:
    pull_request:
        branches:
            - 'main'
            - 'release*'
        paths:
            - 'calm-diagram/**'
            - 'calm-docusaurus-plugin/**'
            - 'calm-models/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/build-calm-diagram.yml'
    push:
        branches:
            - 'main'
            - 'release*'
        paths:
            - 'calm-diagram/**'
            - 'calm-docusaurus-plugin/**'
            - 'calm-models/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/build-calm-diagram.yml'

jobs:
    calm-diagram:
        name: Build, Test, and Lint CALM Diagram and the Docusaurus Plugin
        runs-on: ubuntu-latest

        steps:
            - name: Checkout PR Branch
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install workspace
              run: npm ci

            - name: Lint
              run: |
                  npm run lint --workspace=calm-diagram
                  npm run lint --workspace=calm-docusaurus-plugin

            - name: Build
              run: |
                  npm run build --workspace=calm-models
                  npm run build --workspace=calm-diagram
                  npm run build --workspace=calm-docusaurus-plugin

            - name: Typecheck
              run: |
                  npm run typecheck --workspace=calm-diagram
                  npm run typecheck --workspace=calm-docusaurus-plugin

            - name: Test
              run: |
                  npm run test --workspace=calm-diagram
                  npm run test --workspace=calm-docusaurus-plugin

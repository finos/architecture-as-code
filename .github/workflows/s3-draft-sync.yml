name: Sync Drafts to S3

# No --delete: draft/2025-03 is on calm.finos.org but not in calm/draft (#3507).
# s3-docs-sync.yml excludes draft/*, so its --delete does not remove the drafts either.

permissions:
    contents: read

on:
    workflow_dispatch: {}
    push:
        branches: ['main']
        paths: ['calm/draft/**', '.github/workflows/s3-draft-sync.yml']

jobs:
    sync-to-s3:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1
            - name: Sync calm/draft folder to S3
              run: |
                  aws s3 sync calm/draft s3://${{ vars.AWS_S3_BUCKET }}/draft

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/draft/*"

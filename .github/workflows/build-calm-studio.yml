name: Build CALM Studio

permissions:
    contents: read

on:
    pull_request:
        branches: ['main', 'release*']
        paths:
            - 'calm-studio/**'
            - 'calm-models/**'
            - '.github/workflows/build-calm-studio.yml'
            - 'package.json'
            - 'package-lock.json'
    push:
        branches: ['main', 'release*']
        paths:
            - 'calm-studio/**'
            - 'calm-models/**'
            - '.github/workflows/build-calm-studio.yml'
            - 'package.json'
            - 'package-lock.json'

jobs:
    build-lint-test:
        name: Build, Lint & Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build (in dep order)
              run: |
                  npm run build --if-present --workspace=@finos/calm-models
                  npm run build --if-present --workspace=@calmstudio/calm-core
                  npm run build --if-present --workspace=@calmstudio/extensions
                  npm run build --if-present --workspace=@calmstudio/mcp
                  npm run build --if-present --workspace=@calmstudio/diagram
                  npm run build --if-present --workspace=@calmstudio/studio
                  npm run build --if-present --workspace=calmstudio
                  npm run build --if-present --workspace=@calmstudio/github-action
                  npm run build --if-present --workspace=@finos/calm-docusaurus-plugin

            - name: Lint
              run: |
                  npm run lint --if-present --workspace=@calmstudio/calm-core
                  npm run lint --if-present --workspace=@calmstudio/extensions
                  npm run lint --if-present --workspace=@calmstudio/mcp
                  npm run lint --if-present --workspace=@calmstudio/studio
                  npm run lint --if-present --workspace=@finos/calm-docusaurus-plugin

            - name: Typecheck
              run: |
                  npm run typecheck --if-present --workspace=@calmstudio/calm-core
                  npm run typecheck --if-present --workspace=@calmstudio/extensions
                  npm run typecheck --if-present --workspace=@calmstudio/mcp
                  npm run typecheck --if-present --workspace=@calmstudio/github-action
                  npm run typecheck --if-present --workspace=@finos/calm-docusaurus-plugin

            - name: Test
              run: |
                  npm run test --if-present --workspace=@calmstudio/calm-core
                  npm run test --if-present --workspace=@calmstudio/extensions
                  npm run test --if-present --workspace=@calmstudio/mcp
                  npm run test --if-present --workspace=@calmstudio/studio
                  npm run test --if-present --workspace=@calmstudio/diagram
                  npm run test --if-present --workspace=@finos/calm-docusaurus-plugin

            # GitHub runs the committed dist/index.js, so it must match a fresh build.
            - name: Check the GitHub Action bundle is up to date
              id: check-dist
              run: |
                  if [ -n "$(git status --porcelain -- calm-studio/packages/github-action/dist)" ]; then
                      git status --short -- calm-studio/packages/github-action/dist
                      echo "::error::calm-studio/packages/github-action/dist is out of date. Run 'npm run build --workspace=@calmstudio/github-action' and commit the result, or commit the github-action-dist artifact from this run."
                      exit 1
                  fi

            - name: Upload the rebuilt GitHub Action bundle
              if: failure() && steps.check-dist.outcome == 'failure'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: github-action-dist
                  path: calm-studio/packages/github-action/dist/

    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-latest
        needs: build-lint-test
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npm exec --workspace=@calmstudio/studio -- playwright install --with-deps chromium

            - name: Build
              run: |
                  npm run build --if-present --workspace=@finos/calm-models
                  npm run build --if-present --workspace=@calmstudio/calm-core
                  npm run build --if-present --workspace=@calmstudio/extensions
                  npm run build --if-present --workspace=@calmstudio/mcp
                  npm run build --if-present --workspace=@calmstudio/diagram
                  npm run build --if-present --workspace=@calmstudio/studio
                  npm run build --if-present --workspace=calmstudio
                  npm run build --if-present --workspace=@calmstudio/github-action

            - name: Run E2E tests
              run: npm run test:e2e --workspace=@calmstudio/studio

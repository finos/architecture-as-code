name: CLI + CalmHub Smoke Tests

permissions:
    contents: read

on:
    pull_request:
        paths:
            - 'cli/**'
            - 'calm-hub/**'
            - 'shared/**'
            - '.github/workflows/cli-hub-smoke.yml'
    workflow_dispatch:

jobs:
    cli-hub-smoke:
        name: CLI ↔ CalmHub smoke
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up JDK
              uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install npm dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build:cli

            - name: Build calm-hub:smoke image
              run: bash scripts/build-hub-smoke-image.sh

            - name: Run CLI/CalmHub smoke tests
              run: npm run test:smoke --workspace cli

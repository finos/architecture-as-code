name: CLI + CalmHub Smoke Tests

permissions:
    contents: read

on:
    pull_request:
        paths:
            - 'cli/**'
            - 'calm-hub/**'
            - 'shared/**'
            - 'package.json'
            - 'scripts/copy-calm-schemas.mjs'
            - '.github/workflows/cli-hub-smoke.yml'
    workflow_dispatch:

jobs:
    cli-hub-smoke:
        name: CLI ↔ CalmHub smoke
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up JDK
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install npm dependencies
              run: npm ci

            - name: Build CLI
              run: npm run build:cli

            - name: Build calm-hub:smoke image
              run: bash scripts/build-hub-smoke-image.sh

            - name: Run CLI/CalmHub smoke tests
              run: npm run test:smoke --workspace cli

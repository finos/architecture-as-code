name: Build VS Code Extension

permissions:
    contents: read

on:
    pull_request:
        branches:
            - 'main'
            - 'release*'
    push:
        branches:
            - 'main'
            - 'release*'
    workflow_dispatch:

jobs:
    build-and-test:
        name: Build and Test VS Code Extension
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install workspace
              run: npm ci

            - name: Lint VS Code Extension
              run: npm run lint --workspace=calm-plugins/vscode

            - name: Build and Test VS Code Extension
              run: npm run test:vscode

    package:
        name: Package VS Code Extension
        runs-on: ubuntu-latest
        needs: [build-and-test]

        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install workspace
              run: npm ci

            - name: Determine pre-release flag
              id: prerelease
              working-directory: ./calm-plugins/vscode
              run: |
                  # Odd minor versions are pre-releases. The automated release workflow publishes.
                  MINOR=$(node -p "require('./package.json').version.split('.')[1]")
                  if [ $((MINOR % 2)) -eq 1 ]; then
                    echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
                  else
                    echo "flag=" >> "$GITHUB_OUTPUT"
                  fi

            - name: Package VS Code Extension
              run: |
                  npm run build:shared
                  npm run build --workspace calm-plugins/vscode
                  (cd calm-plugins/vscode && npx @vscode/vsce package ${{ steps.prerelease.outputs.flag }} --no-dependencies)

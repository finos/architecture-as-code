name: CodeQL

# CodeQL advanced setup. It replaces default setup because default setup does not
# analyse pull requests from forks, so a code scanning merge rule would block them.
# Languages and query suite match the previous default setup. Default setup must stay
# off in the repository settings: code scanning rejects this workflow's uploads while it is on.

permissions:
    contents: read

on:
    pull_request:
    push:
        branches:
            - main
    schedule:
        - cron: '27 4 * * 1'
    workflow_dispatch:

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: ['actions', 'java-kotlin', 'javascript-typescript']
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none

            - name: Perform CodeQL analysis
              uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  category: '/language:${{ matrix.language }}'

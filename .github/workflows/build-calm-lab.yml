name: Build CALM Lab

permissions:
    contents: read

on:
    pull_request:
        branches:
            - 'main'
            - 'release*'
        paths:
            - 'calm-lab/**'
            - 'shared/**'
            - 'calm-models/**'
            - 'calm-widgets/**'
            - 'package.json'
            - 'package-lock.json'
            - 'docs/src/plugins/remark-section-callouts.js'
            - '.github/workflows/build-calm-lab.yml'
    push:
        branches:
            - 'main'
            - 'release*'
        paths:
            - 'calm-lab/**'
            - 'shared/**'
            - 'calm-models/**'
            - 'calm-widgets/**'
            - 'package.json'
            - 'package-lock.json'
            - 'docs/src/plugins/remark-section-callouts.js'
            - '.github/workflows/build-calm-lab.yml'

jobs:
    calm-lab:
        name: Build, Test, and Lint CALM Lab
        runs-on: ubuntu-latest

        steps:
            - name: Checkout PR Branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install workspace
              run: npm ci

            - name: Lint calm-lab
              run: npm run lint --workspace=calm-lab

            - name: Build calm-lab (models → widgets → shared → lab)
              run: npm run build:calm-lab

            # After the build: the typecheck resolves @finos/calm-shared/browser through
            # shared/dist/browser.d.ts, which only exists once shared has been built.
            - name: Typecheck calm-lab
              run: npm run typecheck --workspace=calm-lab

            - name: Test calm-lab
              run: npm run test --workspace=calm-lab

            - name: Install Playwright browsers
              run: npm exec --workspace=calm-lab -- playwright install --with-deps chromium

            - name: Browser-test calm-lab
              run: npm run test:e2e --workspace=calm-lab

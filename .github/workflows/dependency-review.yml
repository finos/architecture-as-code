name: Dependency Review

# Blocks pull requests that introduce dependencies with known vulnerabilities
# or that are flagged as malicious (OpenSSF Malicious Packages). Runs on every
# pull request and is a required status check on main - see SECURITY.md,
# "Dependency and code scanning policy".

permissions:
    contents: read

on:
    pull_request:

jobs:
    dependency-review:
        name: dependency-review
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
              with:
                  egress-policy: audit

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Dependency Review
              uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  fail-on-severity: moderate
                  comment-summary-in-pr: never

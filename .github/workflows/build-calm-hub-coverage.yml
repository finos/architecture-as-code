name: Build Calm Hub For Unit Test Coverage

permissions:
    contents: read

on:
    pull_request:
        branches:
            - 'main'
            - 'release*'
    push:
        branches:
            - 'main'
            - 'release*'

jobs:
    build:
        name: Build Calm Hub
        runs-on: ubuntu-latest

        steps:
            # Step 1: Checkout PR Branch
            - name: Checkout PR Branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            # Step 2: Set up JDK
            - name: Set up JDK
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            # Step 3: Cache Maven Dependencies
            - name: Cache Maven Dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.m2
                  # The key names the Maven build. A cache that another build saved does not hold all that this
                  # build needs, and an exact hit is not saved again.
                  key: ${{ runner.os }}-m2-calm-hub-coverage-${{ hashFiles('pom.xml', 'calm-hub/pom.xml') }}
                  restore-keys: |
                      ${{ runner.os }}-m2-calm-hub-coverage-
                      ${{ runner.os }}-m2-

            # Step 4: Build and Test
            - name: Build and Test
              working-directory: calm-hub
              run: mvn clean verify

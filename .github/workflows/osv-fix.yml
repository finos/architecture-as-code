name: OSV Fix

# Opens a pull request that updates package-lock.json after the OSV Scanner run on
# main fails. It only tries `npm update <package> --package-lock-only` for the
# blocking npm findings, so a finding that needs a new major version, an override,
# a Maven or Cargo change, or a suppression still needs a maintainer. The branch
# name is fixed, so a later failure updates the open pull request instead of
# opening another. See SECURITY.md, "Dependency and Code Scanning Policy".

permissions:
    contents: read

on:
    workflow_run:
        workflows: ['OSV Scanner']
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: osv-fix

env:
    # Keep in step with CVSS_THRESHOLD in osv-scanner.yml.
    CVSS_THRESHOLD: '5'
    FIX_BRANCH: osv-fix/npm

jobs:
    osv-fix:
        name: osv-fix
        runs-on: ubuntu-latest
        # The branch filter matches the head branch of the triggering run, which a pull
        # request from a fork can also call main, so only push and scheduled runs count.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.event != 'pull_request' &&
            github.event.workflow_run.head_repository.full_name == github.repository)
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
              with:
                  egress-policy: audit

            # A pull request opened with GITHUB_TOKEN does not run CI, so the release app
            # opens it, as the release workflows do.
            - name: Generate release app token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: main
                  # Full history so the open fix branch can be compared with main.
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install osv-scanner
              run: bash scripts/osv-install.sh

            - name: Scan package-lock.json
              run: |
                  set +e
                  ./osv-scanner scan source \
                    --config osv-scanner.toml \
                    --lockfile package-lock.json \
                    --format json \
                    --output-file osv-before.json
                  STATUS=$?
                  set -e
                  # 0 = nothing found, 1 = vulnerabilities found; anything else is a scan error.
                  if [ "$STATUS" -gt 1 ]; then
                    echo "❌ osv-scanner failed with exit code $STATUS."
                    exit "$STATUS"
                  fi

            - name: Update vulnerable npm packages
              run: bash scripts/osv-fix-npm.sh osv-before.json "$CVSS_THRESHOLD"

            - name: Check for lockfile changes
              id: changes
              run: |
                  if git diff --quiet package-lock.json; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "No lockfile change: no blocking npm finding has a patched version inside the allowed ranges." | tee -a "$GITHUB_STEP_SUMMARY"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Re-scan package-lock.json
              if: steps.changes.outputs.changed == 'true'
              id: after
              run: |
                  set +e
                  ./osv-scanner scan source \
                    --config osv-scanner.toml \
                    --lockfile package-lock.json \
                    --format json \
                    --output-file osv-after.json
                  STATUS=$?
                  set -e
                  if [ "$STATUS" -gt 1 ]; then
                    echo "❌ osv-scanner failed with exit code $STATUS."
                    exit "$STATUS"
                  fi
                  set +e
                  bash scripts/osv-threshold.sh osv-after.json "$CVSS_THRESHOLD" | tee osv-after.txt
                  STATUS=${PIPESTATUS[0]}
                  set -e
                  # 0 = clean, 1 = blocking findings remain; anything else is a script error.
                  case "$STATUS" in
                    0) echo "clean=true" >> "$GITHUB_OUTPUT" ;;
                    1) echo "clean=false" >> "$GITHUB_OUTPUT" ;;
                    *) exit "$STATUS" ;;
                  esac

            - name: Open or update pull request
              if: steps.changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  CLEAN: ${{ steps.after.outputs.clean }}
                  RUN_URL: ${{ github.event.workflow_run.html_url || 'manual run' }}
              run: |
                  # The scan fails twice a day until the fix merges. Do not force-push the open
                  # branch when it already has this lockfile, or when a maintainer has added to it.
                  git fetch origin "$FIX_BRANCH" 2>/dev/null || true
                  if git rev-parse --verify -q "origin/$FIX_BRANCH" >/dev/null; then
                    if git diff --quiet "origin/$FIX_BRANCH" -- package-lock.json; then
                      echo "The open fix branch already has this lockfile. Nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi
                    OTHER_AUTHORS=$(git log --format=%an "origin/$FIX_BRANCH" ^main | grep -v '^github-actions\[bot\]$' || true)
                    if [ -n "$OTHER_AUTHORS" ]; then
                      echo "The open fix branch has commits by a maintainer. Leaving it as it is." | tee -a "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git checkout -B "$FIX_BRANCH"
                  git add package-lock.json
                  git commit -m "fix(deps): update vulnerable npm packages in package-lock.json"
                  git push --force origin "$FIX_BRANCH"

                  {
                    echo "## Description"
                    echo "Automated update of \`package-lock.json\` after the OSV Scanner run on \`main\` failed: ${RUN_URL}"
                    echo
                    echo "Only \`npm update <package> --package-lock-only\` was applied. The manifests are unchanged."
                    echo
                    if [ "$CLEAN" = "true" ]; then
                      echo "The re-scan after the update has no blocking findings."
                    else
                      echo "Blocking findings remain after the update. They need a maintainer: a new major version, an override, or a suppression with a VEX statement (see SECURITY.md)."
                    fi
                    echo
                    echo '```'
                    cat osv-after.txt
                    echo '```'
                    echo
                    echo "## Type of Change"
                    echo "- [x] 🔧 Chore (maintenance, dependencies, CI, etc.)"
                    echo
                    echo "## Affected Components"
                    echo "- [x] Dependencies"
                    echo
                    echo "## Testing"
                    echo "- [x] Re-scanned \`package-lock.json\` with osv-scanner after the update (result above)"
                    echo "- [ ] Build and tests run on this pull request"
                  } > pr-body.md

                  TITLE="fix(deps): update vulnerable npm packages in package-lock.json"
                  # --head alone also matches a fork branch with the same name, so check the owner.
                  NUMBER=$(gh pr list --head "$FIX_BRANCH" --state open --json number,headRepositoryOwner \
                    --jq ".[] | select(.headRepositoryOwner.login == \"$GITHUB_REPOSITORY_OWNER\") | .number" | head -n 1)
                  if [ -n "$NUMBER" ]; then
                    gh pr edit "$NUMBER" --title "$TITLE" --body-file pr-body.md
                    echo "Updated pull request #$NUMBER." | tee -a "$GITHUB_STEP_SUMMARY"
                  else
                    gh pr create --base main --head "$FIX_BRANCH" --title "$TITLE" --body-file pr-body.md | tee -a "$GITHUB_STEP_SUMMARY"
                  fi

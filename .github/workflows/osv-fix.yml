name: OSV Fix

# Opens a pull request that updates package-lock.json after the OSV Scanner run on
# main fails. It only tries `npm update <package> --package-lock-only` for the
# blocking npm findings, so a finding that needs a new major version, an override,
# a Maven change, or a suppression still needs a maintainer. It then scans every
# dependency tree again, as the osv-scanner check does. If blocking findings
# remain, the pull request is a draft, because that check cannot pass on it. The
# branch name is fixed, so a later failure updates the open pull request instead
# of opening another. See SECURITY.md, "Dependency and Code Scanning Policy".

permissions:
    contents: read

on:
    workflow_run:
        workflows: ['OSV Scanner']
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: osv-fix

env:
    # Keep in step with CVSS_THRESHOLD in osv-scanner.yml.
    CVSS_THRESHOLD: '5'
    FIX_BRANCH: osv-fix/npm

jobs:
    osv-fix:
        name: osv-fix
        runs-on: ubuntu-latest
        # The branch filter matches the head branch of the triggering run, which a pull
        # request from a fork can also call main, so pull request runs are excluded. A failed
        # push, scheduled or manual scan of main all start the fix.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'failure' &&
            github.event.workflow_run.event != 'pull_request' &&
            github.event.workflow_run.head_repository.full_name == github.repository)
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
              with:
                  egress-policy: audit

            # A pull request opened with GITHUB_TOKEN does not run CI, so the release app
            # opens it, as the release workflows do.
            - name: Generate release app token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: main
                  # Full history so the open fix branch can be compared with main.
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup Node
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install osv-scanner
              run: bash scripts/osv-install.sh

            - name: Scan dependencies
              run: bash scripts/osv-scan.sh osv-before.json

            - name: Update vulnerable npm packages
              run: bash scripts/osv-fix-npm.sh osv-before.json "$CVSS_THRESHOLD"

            - name: Check for lockfile changes
              id: changes
              run: |
                  if git diff --quiet package-lock.json; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                    echo "No lockfile change: no blocking npm finding has a patched version inside the allowed ranges." | tee -a "$GITHUB_STEP_SUMMARY"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            # The same scan as the osv-scanner check, so a finding outside package-lock.json
            # (a Maven dependency) also counts.
            - name: Re-scan dependencies
              if: steps.changes.outputs.changed == 'true'
              id: after
              run: |
                  bash scripts/osv-scan.sh osv-after.json
                  set +e
                  bash scripts/osv-threshold.sh osv-after.json "$CVSS_THRESHOLD" | tee osv-after.txt
                  STATUS=${PIPESTATUS[0]}
                  set -e
                  # 0 = clean, 1 = blocking findings remain; anything else is a script error.
                  case "$STATUS" in
                    0) echo "clean=true" >> "$GITHUB_OUTPUT" ;;
                    1) echo "clean=false" >> "$GITHUB_OUTPUT" ;;
                    *) exit "$STATUS" ;;
                  esac

            - name: Open or update pull request
              if: steps.changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  CLEAN: ${{ steps.after.outputs.clean }}
                  RUN_URL: ${{ github.event.workflow_run.html_url || 'manual run' }}
              run: bash scripts/osv-fix-pr.sh "$CLEAN" osv-after.txt "$RUN_URL"

name: Build Docs

permissions:
    contents: read

on:
    pull_request:
        branches:
            - 'main'
            - 'release*'
    push:
        branches:
            - 'main'
            - 'release*'

jobs:
    docs:
        name: Build Docs Module
        runs-on: ubuntu-latest

        steps:
            - name: Checkout PR Branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install workspace
              run: npm ci

            - name: Build CALM diagram packages (docs plugin deps)
              run: |
                  npm run build --workspace=@finos/calm-models
                  npm run build --workspace=@finos/calm-diagram
                  npm run build --workspace=@finos/calm-docusaurus-plugin

            - name: Build Docs
              run: npm run build:docs

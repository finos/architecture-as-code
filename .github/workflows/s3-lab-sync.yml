# The bucket (lab.calm.finos.org), its CloudFront distribution, the DNS record, the TLS
# certificate and the AWS_CLOUDFRONT_LAB_DISTRIBUTION_ID secret are provisioned outside this
# repository. Until they exist this job fails loudly rather than silently publishing nowhere.
name: Sync Lab to S3

permissions:
    contents: read
    actions: read # needed for gh run list in the dependency scan check

concurrency:
    group: s3-lab-sync
    cancel-in-progress: false

on:
    workflow_dispatch: {}
    push:
        branches: ['main']
        paths:
            - 'calm-lab/**'
            - 'shared/**'
            - 'calm-models/**'
            - 'calm-widgets/**'
            - 'calm/**'
            - 'package.json'
            - 'package-lock.json'

jobs:
    sync-to-s3:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Check dependency scan status
              run: |
                  # Deploy only if OSV Scanner passed on the commit being deployed.
                  # Wait for the push-triggered scan of that commit; a missing or failed scan blocks the deploy.
                  # Only push runs count: a pull request run can report the same branch name or commit.
                  SHA=$(git rev-parse HEAD)
                  RUN='{}'
                  for _ in $(seq 1 30); do
                    RUN=$(gh run list \
                      --workflow=osv-scanner.yml \
                      --commit="$SHA" \
                      --event=push \
                      --limit=1 \
                      --json status,conclusion,url \
                      --jq '.[0] // {}')
                    STATUS=$(echo "$RUN" | jq -r '.status // empty')
                    if [ "$STATUS" = "completed" ]; then
                      break
                    fi
                    echo "Waiting for the dependency scan of $SHA (status: ${STATUS:-not started})..."
                    sleep 30
                  done
                  echo "Dependency scan of $SHA: $RUN"

                  if [ "$(echo "$RUN" | jq -r '.conclusion // empty')" != "success" ]; then
                    echo "❌ The dependency scan of $SHA did not pass. Fix or suppress the findings before deploying."
                    exit 1
                  fi
                  echo "✅ Dependency scan passed on $SHA."
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: npm ci

            - name: Build the lab (models → widgets → shared → lab)
              run: npm run build:calm-lab

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
              with:
                  aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
                  aws-region: us-east-1

            - name: Sync lab to S3
              run: |
                  aws s3 sync dist s3://lab.calm.finos.org/ --delete
              working-directory: "calm-lab"

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_LAB_DISTRIBUTION_ID }} --paths "/*"

name: License Scanning for Node.js

permissions:
    contents: read

on:
    schedule:
        - cron: '0 8,18 * * 1-5'
    push:
        paths:
            - '**/package-lock.json'
            - '**/package.json'
            - '.github/workflows/license-scanning-node.yml'

jobs:
    scan:
        if: github.repository == 'finos/architecture-as-code'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['26.x']
                module-folder: ['cli', 'docs', 'shared']
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: ${{ matrix.node-version }}
            - run: npm install --omit=dev --ignore-scripts
              working-directory: ${{ matrix.module-folder }}
            - run: npm install -g license-checker-rseidelsohn@5.0.1
              working-directory: ${{ matrix.module-folder }}
            - run: license-checker-rseidelsohn --production --excludePrivatePackages --onlyAllow 'Apache-2.0;MIT;BSD-2-Clause;BSD;BSD-3-Clause;Unlicense;ISC'
              working-directory: ${{ matrix.module-folder }}

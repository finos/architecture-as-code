name: CALM Schema Compatibility

# Tests every tool against a @finos/calm-schema release, and opens an issue that names the
# tools that fail. The helpers are in scripts/calm-schema-compat.mjs.

permissions:
    contents: read

on:
    # Sent by the finos/calm-schema publish workflow after npm publish, with
    # client_payload: {"version": "x.y.z"}. Not wired yet: it needs a GitHub App token there.
    repository_dispatch:
        types: [calm-schema-published]
    # Fallback for a missed dispatch: checks the npm latest version.
    schedule:
        - cron: '30 6 * * *'
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to test, for example 1.3.0. Empty: the npm latest version.'
                required: false
                default: ''
                type: string

# One group per requested version. Scheduled runs and manual runs without a version share the
# "latest" group. GitHub keeps one pending run per group and cancels an older pending run. The
# report job also has a group per resolved version, so that two runs cannot both open an issue.
concurrency:
    group: calm-schema-compatibility-${{ github.event.client_payload.version || inputs.version || 'latest' }}
    cancel-in-progress: false

env:
    LABEL: calm-schema-compatibility
    # The cache path is part of the cache version, so restore and save must use the same path.
    PASS_MARKER: .calm-schema-compat-pass

jobs:
    resolve:
        name: Resolve version
        # Forks do not run the daily check.
        if: github.event_name != 'schedule' || github.repository == 'finos/architecture-as-code'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: read
        outputs:
            version: ${{ steps.version.outputs.version }}
            skip: ${{ steps.decide.outputs.skip }}

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            # Fails if the version is not on npm, so that no test runs and no issue opens. A
            # dispatch retries for about five minutes, because npm metadata can lag a publish.
            - name: Resolve the version to test
              id: version
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
                  INPUT_VERSION: ${{ inputs.version }}
              run: node scripts/calm-schema-compat.mjs resolve

            # A cache entry marks a version that passed. lookup-only does not download it.
            - name: Look for a pass marker
              id: marker
              if: github.event_name == 'schedule'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ env.PASS_MARKER }}
                  key: calm-schema-compat-pass-${{ steps.version.outputs.version }}
                  lookup-only: true

            # Open and closed: a scheduled run skips a version that has any issue.
            - name: List compatibility issues
              if: github.event_name == 'schedule'
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
              run: gh issue list --repo "$REPO" --label "$LABEL" --state all --limit 100 --json number,title,state > "$RUNNER_TEMP/issues.json"

            - name: Decide whether to skip
              id: decide
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  VERSION: ${{ steps.version.outputs.version }}
                  PINNED: ${{ steps.version.outputs.pinned }}
                  PASSED: ${{ steps.marker.outputs.cache-hit }}
                  ISSUES_FILE: ${{ runner.temp }}/issues.json
              run: node scripts/calm-schema-compat.mjs decide

    test:
        # The report job finds each result by this name.
        name: ${{ matrix.tool }}
        needs: resolve
        if: needs.resolve.outputs.skip != 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                tool: [cli, shared, calm-server, calm-lab, calm-studio, vscode, calm-hub]

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Set up JDK
              if: matrix.tool == 'calm-hub'
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Cache Maven Dependencies
              if: matrix.tool == 'calm-hub'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.m2
                  key: ${{ runner.os }}-m2-${{ hashFiles('calm-hub/pom.xml') }}
                  restore-keys: |
                      ${{ runner.os }}-m2-

            # Testcontainers needs Docker.
            - name: Set up Docker
              if: matrix.tool == 'calm-hub'
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

            # Changes package.json and package-lock.json in the runner only, then runs npm ci, so
            # that the calm-hub build's own npm install keeps the version.
            - name: Use @finos/calm-schema ${{ needs.resolve.outputs.version }}
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
              run: node scripts/calm-schema-compat.mjs use "$VERSION"

            - name: Build and test ${{ matrix.tool }}
              env:
                  TOOL: ${{ matrix.tool }}
              run: node scripts/calm-schema-compat.mjs test "$TOOL"

    report:
        name: Report
        needs: [resolve, test]
        if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            issues: write
        concurrency:
            group: calm-schema-compatibility-report-${{ needs.resolve.outputs.version }}
            cancel-in-progress: false

        steps:
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version-file: '.nvmrc'

            - name: Plan the report
              id: plan
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  RUN_ID: ${{ github.run_id }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  VERSION: ${{ needs.resolve.outputs.version }}
                  JOBS_FILE: ${{ runner.temp }}/jobs.json
                  ISSUES_FILE: ${{ runner.temp }}/open-issues.json
                  BODY_FILE: ${{ runner.temp }}/body.md
                  EVENT_NAME: ${{ github.event_name }}
                  REF_NAME: ${{ github.ref_name }}
                  # Empty on schedule. The script reads it only for a manual run.
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              # filter=all lists the jobs of every attempt; the script takes the latest attempt of
              # each tool. One page of 100 holds about ten attempts of this matrix; --paginate gets more.
              run: |
                  gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > "$JOBS_FILE"
                  gh issue list --repo "$REPO" --label "$LABEL" --state open --limit 100 --json number,title > "$ISSUES_FILE"
                  node scripts/calm-schema-compat.mjs report

            - name: Update the issue
              if: steps.plan.outputs.action != 'none'
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  ACTION: ${{ steps.plan.outputs.action }}
                  ISSUE: ${{ steps.plan.outputs.issue }}
                  TITLE: ${{ steps.plan.outputs.title }}
                  PLACEHOLDER: ${{ steps.plan.outputs.placeholder }}
                  BODY_FILE: ${{ runner.temp }}/body.md
              # A closed issue for the version is not reopened. A new failure gets a new issue.
              run: |
                  case "$ACTION" in
                    create)
                      if ! gh api "repos/$REPO/labels/$LABEL" --silent 2>/dev/null; then
                        gh label create "$LABEL" --repo "$REPO" --color D93F0B \
                          --description "A @finos/calm-schema release breaks a tool"
                      fi
                      url="$(gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" --body-file "$BODY_FILE")"
                      number="${url##*/}"
                      sed "s/$PLACEHOLDER/$number/g" "$BODY_FILE" > "$BODY_FILE.final"
                      gh issue edit "$number" --repo "$REPO" --body-file "$BODY_FILE.final"
                      echo "Created $url"
                      ;;
                    comment)
                      gh issue comment "$ISSUE" --repo "$REPO" --body-file "$BODY_FILE"
                      ;;
                    close)
                      gh issue comment "$ISSUE" --repo "$REPO" --body-file "$BODY_FILE"
                      gh issue close "$ISSUE" --repo "$REPO" --reason completed
                      ;;
                  esac

            - name: Write the pass marker
              if: steps.plan.outputs.passed == 'true'
              env:
                  VERSION: ${{ needs.resolve.outputs.version }}
              run: echo "$VERSION" > "$PASS_MARKER"

            - name: Save the pass marker
              if: steps.plan.outputs.passed == 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ env.PASS_MARKER }}
                  key: calm-schema-compat-pass-${{ needs.resolve.outputs.version }}

name: VS Code Extension - Automated Release

concurrency:
  group: vscode-release
  cancel-in-progress: false

permissions:
  contents: write # needed to push the release tag and create the GitHub release
  pull-requests: write # needed to open the release PR

on:
  schedule:
    - cron: '30 7 * * 4'  # Run at 7:30 AM GMT on Thursday
  workflow_dispatch:
    inputs:
      force-release:
        description: 'Force a release even if no relevant changes are detected'
        required: false
        type: boolean
        default: false
      release-type:
        description: 'Release type (only used with force-release). preview = next odd minor, stable = next even minor'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - preview
          - stable
          - major
  pull_request:
    types:
      - closed

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Only run analysis on schedule or manual trigger, not on PR merge
    if: github.event_name != 'pull_request'
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      release-type: ${{ steps.check.outputs.release-type }}
      next-version: ${{ steps.check.outputs.next-version }}
      current-version: ${{ steps.check.outputs.current-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Check for an open release PR
        run: |
          OPEN=$(gh pr list --state open --label automated-release \
            --json headRefName --jq '[.[] | select(.headRefName | startswith("release/vscode-v"))] | length')
          if [ "$OPEN" != "0" ]; then
            echo "❌ A VS Code release PR is already open. Merge or close it before running a new release."
            exit 1
          fi
          echo "✅ No open VS Code release PR."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check build-vscode-extension workflow status
        run: |
          CONCLUSION=$(gh run list --workflow=build-vscode-extension.yml --branch=main --event=push \
            --limit=1 --json conclusion --jq '.[0].conclusion // empty')
          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ build-vscode-extension.yml has not passed on main (conclusion: ${CONCLUSION:-none}). Skipping release."
            exit 1
          fi
          echo "✅ build-vscode-extension.yml has passed on main."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release type
        id: check
        env:
          FORCE_RELEASE: ${{ github.event.inputs.force-release }}
          FORCE_RELEASE_TYPE: ${{ github.event.inputs.release-type }}
        run: |
          set -o pipefail
          if [ "$FORCE_RELEASE" = "true" ]; then
            node scripts/vscode-release-version.mjs --force "$FORCE_RELEASE_TYPE" | tee -a "$GITHUB_OUTPUT"
          else
            node scripts/vscode-release-version.mjs | tee -a "$GITHUB_OUTPUT"
          fi

  create-version-pr:
    needs: analyze
    runs-on: ubuntu-latest
    if: needs.analyze.outputs.should-release == 'true'
    steps:
      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Create release branch
        env:
          NEXT_VERSION: ${{ needs.analyze.outputs.next-version }}
        run: |
          # Not npm version or npm pkg set: they also sync unrelated lockfile entries and reformat
          # package.json. Change only the extension's version.
          node -e '
            const fs = require("fs");
            const pkgFile = "calm-plugins/vscode/package.json";
            fs.writeFileSync(pkgFile, fs.readFileSync(pkgFile, "utf8").replace(/"version": "[^"]*"/, `"version": "${process.argv[1]}"`));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            lock.packages["calm-plugins/vscode"].version = process.argv[1];
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 4) + "\n");
          ' "$NEXT_VERSION"
          # The changelog gives the untagged package.json version a section for the changes since the last tag.
          npm run changelog --workspace calm-plugins/vscode

          git checkout -b "release/vscode-v$NEXT_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calm-plugins/vscode/package.json calm-plugins/vscode/CHANGELOG.md package-lock.json
          git commit -m "ci(vscode): release version $NEXT_VERSION"
          git push origin "release/vscode-v$NEXT_VERSION"

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CURRENT_VERSION: ${{ needs.analyze.outputs.current-version }}
          NEXT_VERSION: ${{ needs.analyze.outputs.next-version }}
          RELEASE_TYPE: ${{ needs.analyze.outputs.release-type }}
        run: |
          if [ $(( $(echo "$NEXT_VERSION" | cut -d. -f2) % 2 )) -eq 1 ]; then
            CHANNEL="a pre-release (odd minor version)"
          else
            CHANNEL="a stable release (even minor version)"
          fi
          PR_BODY="🚀 **Automated Release PR**

          This PR updates the VS Code extension version from $CURRENT_VERSION to $NEXT_VERSION ($RELEASE_TYPE). It is published as $CHANNEL.

          **Changes:**
          - Updated package.json version to $NEXT_VERSION
          - Updated CHANGELOG.md with release notes

          **Next Steps:**
          Upon merging this PR, the automated publish workflow will publish the extension to the VS Code Marketplace, tag the release and create a GitHub release.

          ⚠️ Do not edit this PR manually - it is generated automatically"

          gh pr create \
            --title "ci(vscode): release version $NEXT_VERSION" \
            --body "$PR_BODY" \
            --head "release/vscode-v$NEXT_VERSION" \
            --base main \
            --label "automated-release"

          echo "📋 Version update PR created for branch: release/vscode-v$NEXT_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $CURRENT_VERSION → $NEXT_VERSION ($RELEASE_TYPE)" >> $GITHUB_STEP_SUMMARY

  publish-on-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'automated-release') &&
      startsWith(github.event.pull_request.head.ref, 'release/vscode-v')
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit

      # The merge commit, not main: the tag must be on the commit that is published.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Check dependency scan status
        run: |
          # Publish only if OSV Scanner passed on the commit being released.
          # Wait for the push-triggered scan of that commit; a missing or failed scan blocks the release.
          # Only push runs count: a pull request run can report the same branch name or commit.
          SHA=$(git rev-parse HEAD)
          RUN='{}'
          for _ in $(seq 1 30); do
            RUN=$(gh run list \
              --workflow=osv-scanner.yml \
              --commit="$SHA" \
              --event=push \
              --limit=1 \
              --json status,conclusion,url \
              --jq '.[0] // {}')
            STATUS=$(echo "$RUN" | jq -r '.status // empty')
            if [ "$STATUS" = "completed" ]; then
              break
            fi
            echo "Waiting for the dependency scan of $SHA (status: ${STATUS:-not started})..."
            sleep 30
          done
          echo "Dependency scan of $SHA: $RUN"

          if [ "$(echo "$RUN" | jq -r '.conclusion // empty')" != "success" ]; then
            echo "❌ The dependency scan of $SHA did not pass. Fix or suppress the findings before releasing."
            exit 1
          fi
          echo "✅ Dependency scan passed on $SHA."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Get version from package.json
        id: version
        working-directory: ./calm-plugins/vscode
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [ $((MINOR % 2)) -eq 1 ]; then
            echo "pre-release=true" >> $GITHUB_OUTPUT
          else
            echo "pre-release=false" >> $GITHUB_OUTPUT
          fi
          echo "Publishing VS Code extension version: $VERSION"

      - name: Package VS Code Extension
        env:
          PRE_RELEASE_FLAG: ${{ steps.version.outputs.pre-release == 'true' && '--pre-release' || '' }}
        run: |
          npm run build:shared
          npm run build --workspace calm-plugins/vscode
          (cd calm-plugins/vscode && npx @vscode/vsce package $PRE_RELEASE_FLAG --no-dependencies)

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "vscode-v$VERSION" -m "CALM VS Code extension $VERSION, as published to the VS Code Marketplace"
          git push origin "vscode-v$VERSION"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRE_RELEASE: ${{ steps.version.outputs.pre-release }}
        run: |
          cd calm-plugins/vscode
          RELEASE_NOTES=$(awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md || echo "")
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Release of VS Code extension version $VERSION"
          fi
          PRE_RELEASE_ARG=""
          if [ "$PRE_RELEASE" = "true" ]; then
            PRE_RELEASE_ARG="--prerelease"
          fi

          gh release create "vscode-v$VERSION" \
            --title "VS Code Extension v$VERSION" \
            --notes "$RELEASE_NOTES" \
            --verify-tag \
            $PRE_RELEASE_ARG \
            ./*.vsix

      - name: Publish to VS Code Marketplace
        working-directory: ./calm-plugins/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PRE_RELEASE_FLAG: ${{ steps.version.outputs.pre-release == 'true' && '--pre-release' || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx @vscode/vsce publish $PRE_RELEASE_FLAG --packagePath ./*.vsix

          echo "✅ Successfully published CALM VS Code extension $VERSION to the VS Code Marketplace" >> $GITHUB_STEP_SUMMARY

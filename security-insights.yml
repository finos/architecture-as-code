header:
  schema-version: 2.2.0
  last-updated: '2026-10-02'
  last-reviewed: '2026-09-26'
  url: https://raw.githubusercontent.com/finos/architecture-as-code/main/security-insights.yml
  comment: |
    Architecture as Code (CALM) spans three GitHub repositories: this monorepo,
    finos/calm-schema and finos/calm-governance. The other entries under
    project.repositories are subprojects/packages within this monorepo,
    compiled into independent releases (npm packages, Docker images, a VS Code
    extension, etc).

project:
  name: Architecture as Code (CALM)
  homepage: https://calm.finos.org
  roadmap: https://roadmapper.rocketstack.co/view/finos/architecture-as-code/ffffff/24292f
  administrators:
    - name: rocketstack-matt
      primary: true
    - name: jpgough-ms
      primary: false
    - name: markscott-ms
      primary: false
  documentation:
    quickstart-guide: https://calm.finos.org/tutorials/
    detailed-guide: https://calm.finos.org/
    design: https://calm.finos.org/core-concepts/
    code-of-conduct: https://www.finos.org/code-of-conduct
    release-process: https://github.com/finos/architecture-as-code/blob/main/CONTRIBUTING.md#-why-we-use-semantic-release
    support-policy: https://github.com/finos/architecture-as-code/blob/main/SUPPORT.md
    signature-verification: https://github.com/finos/architecture-as-code/blob/main/SECURITY.md#verifying-release-integrity-and-authenticity
  repositories:
    - name: calm-schema
      url: https://github.com/finos/calm-schema
      comment: |
        Separate repository. CALM JSON Schema, published to npm as
        @finos/calm-schema with SLSA provenance. Status: Incubating, actively
        maintained.
    - name: calm-governance
      url: https://github.com/finos/calm-governance
      comment: |
        Separate repository. Project-wide governance, maintainer roster and
        contribution guidelines. Documentation only; no releases.
    - name: calm
      url: https://github.com/finos/architecture-as-code/tree/main/calm
      comment: |
        CALM JSON Meta Schema specification, the core architecture modelling
        language this project is built around. Status: Incubating, actively
        maintained.
    - name: cli
      url: https://github.com/finos/architecture-as-code/tree/main/cli
      comment: |
        @finos/calm-cli, the TypeScript CLI for validating, generating and
        visualizing CALM architectures. Published to npm. Status: Incubating,
        actively maintained.
    - name: shared
      url: https://github.com/finos/architecture-as-code/tree/main/shared
      comment: |
        @finos/calm-shared, TypeScript utilities shared across the CLI, the
        VSCode extension and other CALM tooling. Bundled into the CLI; not
        published separately.
        Status: Incubating, actively maintained.
    - name: calm-models
      url: https://github.com/finos/architecture-as-code/tree/main/calm-models
      comment: |
        @finos/calm-models, TypeScript data models generated from the CALM
        schema and consumed across the TypeScript packages. The TypeScript
        models are bundled into the CLI; the Java models are published to
        Maven Central.
        Status: Incubating, actively maintained.
    - name: calm-widgets
      url: https://github.com/finos/architecture-as-code/tree/main/calm-widgets
      comment: |
        @finos/calm-widgets, React visualization components and Handlebars
        template widgets used to render CALM architectures. Bundled into the
        CLI; not published separately.
        Status: Incubating, actively maintained.
    - name: calm-ai
      url: https://github.com/finos/architecture-as-code/tree/main/calm-ai
      comment: |
        AI agent tools and prompts for working with CALM. Prompt/tooling
        assets only (no build), managed separately from the CLI for easier
        maintenance and broader reuse. Status: Incubating, actively maintained.
    - name: calm-hub
      url: https://github.com/finos/architecture-as-code/tree/main/calm-hub
      comment: |
        CALM Hub, a Java/Quarkus REST API backend for storing and serving
        CALM architectures (MongoDB or NitriteDB storage). Published as a
        Docker image. Status: Incubating, actively maintained.
    - name: calm-hub-ui
      url: https://github.com/finos/architecture-as-code/tree/main/calm-hub-ui
      comment: |
        React frontend for CALM Hub. Status: Incubating, actively maintained.
    - name: calm-server
      url: https://github.com/finos/architecture-as-code/tree/main/calm-server
      comment: |
        @finos/calm-server, a TypeScript CALM server package. Published to
        npm. Status: Incubating, actively maintained.
    - name: calm-plugins/vscode
      url: https://github.com/finos/architecture-as-code/tree/main/calm-plugins/vscode
      comment: |
        VS Code extension for authoring and validating CALM architectures.
        Published to the VS Code Marketplace as finos.calm-vscode-plugin.
        Status: Incubating, actively maintained.
    - name: calm-studio
      url: https://github.com/finos/architecture-as-code/tree/main/calm-studio
      comment: |
        SvelteKit visual CALM editor; itself a nested npm-workspace monorepo
        (calm-core, calmscript, extensions, github-action, mcp, diagram web
        component, vscode-extension, studio app). Status: Experimental. Its npm and
        desktop releases are outside the release controls in SECURITY.md until promoted.
    - name: calm-guard
      url: https://github.com/finos/architecture-as-code/tree/main/calm-guard
      comment: |
        CALMGuard, a Next.js continuous-compliance platform for validating
        architectures against CALM controls, plus its Docusaurus docs site.
        Status: Experimental.
    - name: docs
      url: https://github.com/finos/architecture-as-code/tree/main/docs
      comment: |
        Docusaurus documentation site published at calm.finos.org.
        Status: Incubating, actively maintained.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Architecture as Code Maintainers
      primary: true
    policy: https://github.com/finos/architecture-as-code/security/advisories/new
    comment: |
      GitHub private vulnerability reporting is enabled on this repository;
      use the "Report a vulnerability" action under the Security tab.

repository:
  url: https://github.com/finos/architecture-as-code
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: rocketstack-matt
      primary: true
    - name: jpgough-ms
      primary: false
    - name: markscott-ms
      primary: false
  documentation:
    contributing-guide: https://github.com/finos/architecture-as-code/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/finos/architecture-as-code/blob/main/SECURITY.md#dependency-and-code-scanning-policy
    governance: https://github.com/finos/calm-governance/blob/main/GOVERNANCE.md
    review-policy: https://github.com/finos/architecture-as-code/blob/main/MAINTAINERS_GUIDELINES.md
    security-policy: https://github.com/finos/architecture-as-code/blob/main/SECURITY.md
  license:
    url: https://github.com/finos/architecture-as-code/blob/main/LICENSE
    expression: Apache-2.0
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/finos/architecture-as-code/releases
        comment: GitHub Releases page for tagged releases across the monorepo's packages.
      - uri: https://www.npmjs.com/package/@finos/calm-cli
        comment: npm package for the CALM CLI.
      - uri: https://www.npmjs.com/package/@finos/calm-server
        comment: npm package for CALM Server.
      - uri: https://central.sonatype.com/artifact/org.finos.calm/calm-models
        comment: Maven Central artifact for the CALM Java models, GPG-signed.
      - uri: https://hub.docker.com/r/finos/calm-hub
        comment: Docker Hub image for CALM Hub.
      - uri: https://marketplace.visualstudio.com/items?itemName=finos.calm-vscode-plugin
        comment: VS Code Marketplace listing for the CALM VSCode extension.
    attestations:
      - name: npm provenance (SLSA) for @finos/calm-cli
        location: https://www.npmjs.com/package/@finos/calm-cli
        predicate-uri: https://slsa.dev/provenance/v1
        comment: |
          Published with `npm publish --provenance` from automated-release.yml. The package page shows
          the provenance for each version and links to its Sigstore transparency log entry. Verify with
          `npm audit signatures`; see SECURITY.md, "Verifying Release Integrity and Authenticity".
      - name: npm provenance (SLSA) for @finos/calm-server
        location: https://www.npmjs.com/package/@finos/calm-server
        predicate-uri: https://slsa.dev/provenance/v1
        comment: |
          Published with `npm publish --provenance` from automated-release-calm-server.yml. The package
          page shows the provenance for each version and links to its Sigstore transparency log entry.
      - name: Docker provenance and SBOM
        location: https://hub.docker.com/r/finos/calm-hub
        predicate-uri: https://slsa.dev/provenance/v1
        comment: |
          calm-hub images are built by docker/build-push-action with
          provenance and SBOM attestations attached to the image index. The SBOM of a
          native image lists only its base image.
  security:
    assessments:
      self:
        name: Threat model and attack surface analysis
        date: '2026-09-26'
        evidence: https://github.com/finos/architecture-as-code/blob/main/THREAT_MODEL.md
        comment: |
          Maintainer-authored threat model and attack surface analysis covering
          the CLI, CALM Server, CALM Hub, the VS Code extension and the build
          and release pipeline. Reviewed at least yearly and whenever a
          component gains a new interface, trust boundary or distribution channel.
    tools:
      - name: CodeQL
        type: SAST
        comment: .github/workflows/codeql.yml (advanced setup); runs on every pull request, including pull requests from forks, and weekly against main.
        rulesets:
          - default
        integration:
          adhoc: false
          ci: true
          release: false
      - name: Semgrep
        type: SAST
        comment: Runs on every pull request via .github/workflows/semgrep-ci.yml; the semgrep/ci check is required on main.
        rulesets:
          - Semgrep AppSec Platform policy for finos/architecture-as-code
        integration:
          adhoc: false
          ci: true
          release: false
      - name: OSV Scanner
        type: SCA
        comment: |
          .github/workflows/osv-scanner.yml on every pull request, on push to main and twice each
          working day. Scans the root npm lockfile, the calm-hub and calm-models Maven projects and
          the CALM Studio Cargo lockfile; fails on CVSS >= 5; suppressions with justification in
          osv-scanner.toml. The CLI and calm-server release workflows publish only if the scan of
          the commit being released passed.
        rulesets:
          - OSV database, CVSS >= 5
        integration:
          adhoc: false
          ci: true
          release: true
      - name: Dependency Review
        type: SCA
        comment: actions/dependency-review-action on every pull request; blocks known-vulnerable and known-malicious dependencies.
        rulesets:
          - fail-on-severity moderate
        integration:
          adhoc: false
          ci: true
          release: false
      - name: Dependabot
        type: SCA
        comment: Security updates and alerts for npm, Maven, Cargo and GitHub Actions.
        rulesets:
          - GitHub Advisory Database
        integration:
          adhoc: false
          ci: true
          release: false

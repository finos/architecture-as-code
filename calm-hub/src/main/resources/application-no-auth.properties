# No-auth profile: grants every request a non-anonymous identity so that
# @PermissionsAllowed checks pass unconditionally. For local development and
# testing ONLY.
# WARNING: Do NOT use this profile in production — it disables all authentication.
quarkus.oidc.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.tenant-enabled=false
calm.auth.enabled=false

# Browser SPAs (CalmStudio Vite :5173, Studio Docker :8090) call Hub :8080 cross-origin.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8090,http://127.0.0.1:8090
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.access-control-allow-credentials=false

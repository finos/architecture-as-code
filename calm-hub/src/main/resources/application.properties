quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Calm Hub
#If using in quarkus dev mode can be 'mongo' or 'standalone'
calm.database.mode=mongo
# Base URL used to verify and rewrite $id in POST bodies to the name-based API.
# Defaults to http://localhost:8080 when unset.
# calm.hub.base-url=http://localhost:8080
# Standalone mode configuration
calm.standalone.data-directory=${user.home}/.calm-hub/data
calm.standalone.database-name=calmSchemas
calm.standalone.username=admin
calm.standalone.password=admin
calm.standalone.init-script-path=mongo/init-mongo.js
# Seed a demo namespace/architecture/layout on first startup when the database is empty.
# Set to false to start standalone mode with a completely empty database.
calm.standalone.seed-demo-data=false
# Read-only mode: when true, opens Nitrite with readOnly(true) and rejects mutating HTTP verbs
calm.readonly=false

# GitHub HTTP client timeouts (seconds) — applies when calm.database.mode=github
calm.github.http.connect-timeout=${CALM_GITHUB_HTTP_CONNECT_TIMEOUT:10}
calm.github.http.request-timeout=${CALM_GITHUB_HTTP_REQUEST_TIMEOUT:30}

# Audit logging: independently toggle persistence to the auditLogs store and
# emission of a structured log line under the org.finos.calm.audit category.
# Both default to true. sourceIp capture defaults to false and has its own
# toggle, since some data-minimization policies treat IP addresses specially.
calm.audit.store.enabled=true
calm.audit.log.enabled=true
calm.audit.capture-source-ip=false
quarkus.mongodb.connection-string = mongodb://localhost:27017
quarkus.mongodb.database = calmSchemas

# ---------------------------------------------------------------------------
# Test profile.
#
# These live here, rather than in src/test/resources/application.properties,
# because keeping them in a second file is not reliable.
#
# What we measured on Quarkus 3.34.7 in this module: with an
# application.properties present in src/test/resources, the settings above
# stopped applying during tests — including with a deliberately EMPTY file in
# src/test/resources, which rules out any per-property conflict.
#
# What the config reference says: each application.properties found is a
# separate ConfigSource merged "override per property", which would make the
# above impossible.
# https://quarkus.io/guides/config-reference#configuration-sources
#
# So documented and observed behaviour disagree and we could not reconcile them.
# (An old quarkus-dev thread reports the same shadowing and recommends the
# %test. prefix, but it predates this version by years and may not describe
# current internals, so it is context rather than justification.)
#
# Using one file sidesteps the question entirely: there is only ever a single
# application.properties, so no precedence rule has to be relied upon.
#
# When it was split across two files, whichever file won broke something:
#   this file wins  -> tests lose calm.audit.*=false, so audit does live Mongo
#                      I/O and writes into whatever MongoDB the developer
#                      happens to be running
#   test file wins  -> tests lose calm.auth.enabled and the security-header
#                      filter below, so TestCurrentUserAccessResourceShould and
#                      TestSecurityResponseHeadersShould fail (7 tests) while
#                      passing in isolation
# ---------------------------------------------------------------------------
%test.quarkus.arc.remove-unused-beans=false
%test.quarkus.test.continuous-testing=enabled
%test.quarkus.test.flat-class-path=true

# Align Quarkus coverage output with jacoco-maven-plugin.
#
# Deliberately NOT %test.-prefixed, unlike everything around them. Both are
# build-time-fixed properties, read during augmentation. Tests that declare their
# own profile name via QuarkusTestProfile.getConfigProfile() (secure,
# integration-test, and the other custom profiles) augment under that name, where
# a %test. prefix does not apply — the properties then fix to null/false, and
# Quarkus diverts coverage to target/jacoco-quarkus.exec with the warning
# "quarkus.jacoco.data-file is set to 'target/jacoco.exec' but it is build time
# fixed to 'null'". Every @QuarkusTest-covered class then reports 0% and the
# jacoco check fails ~40 classes. Whether it bites depends on test ordering, so
# it surfaces as an unrelated change "breaking coverage".
#
# Leave these unprefixed: the jacoco extension is test-scoped, so they are inert
# in a real deployment.
quarkus.jacoco.data-file=target/jacoco.exec
quarkus.jacoco.reuse-data-file=true

# Database configuration for tests
%test.quarkus.mongodb.database=test
%test.quarkus.mongodb.devservices.enabled=true

# Audit logging performs live Mongo/Nitrite I/O on every mutating request via a global
# response filter, unconditionally — unlike every other store, it isn't @InjectMock-ed
# per test. Disabled for the general unit-test suite so the ~300 pre-existing resource
# tests (which mock their own target store and never depended on live Mongo before)
# don't newly depend on Mongo Dev Services being fast/available on every mutating call.
# Audit logging's own correctness is covered by the dedicated Test*Audit* unit tests
# (which set these flags directly, bypassing this config) and by the -P integration
# tests (whose profiles don't override this, so it stays enabled there deliberately).
%test.calm.audit.store.enabled=false
%test.calm.audit.log.enabled=false

# Standalone-mode settings used by the tests
%test.calm.database.mode=mongo
%test.calm.standalone.data-directory=target/test-data
%test.calm.standalone.database-name=calmSchemasTest
%test.calm.standalone.init-script-path=src/test/resources/init-mongo.js

# Standalone profile: activates NitriteDB mode and suppresses MongoDB health-check
# and dev-services so Quarkus does not spin up a MongoDB container or report the
# MongoDB health indicator as failing. The connection string and database name are
# intentionally kept at their default values — the Quarkus MongoDB extension requires
# a non-empty database name and creating a MongoClient config is harmless: all Mongo
# CDI beans are gated by @LookupIfProperty(calm.database.mode=mongo) so the client is
# never actually used in standalone mode.
%standalone.calm.database.mode=standalone
%standalone.quarkus.mongodb.health.enabled=false
%standalone.quarkus.mongodb.devservices.enabled=false
# Standalone is a local-dev mode — disable auth so it works without an IdP.
%standalone.calm.auth.enabled=false
# Suppress noisy "Connection refused" log spam from the MongoDB driver background
# monitor threads — the MongoClient is created by the Quarkus extension but never
# used in standalone mode (all Mongo CDI beans are @LookupIfProperty-gated).
%standalone.quarkus.log.category."org.mongodb.driver.cluster".level=ERROR
%standalone.quarkus.log.category."org.mongodb.driver.client".level=ERROR
%standalone.quarkus.log.category."org.mongodb.driver.connection".level=ERROR

#Disable creating the keycloak container for default profile.
quarkus.oidc.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.tenant-enabled=false

# Default profile is secure — no authentication mechanism is wired, so all requests
# are rejected with 401. Explicitly activate a profile to enable access:
#   no-auth     — open access for local development/testing (no IdP needed)
#   secure      — JWT/OIDC via Keycloak
#   proxy-auth  — identity injected by an upstream proxy
calm.auth.enabled=true

#quarkus.http.port=8081

# Security response headers — applied to all routes.
# nosniff stops browsers content-type-sniffing error bodies into HTML (the
# backstop behind the STRICT_SANITIZATION_POLICY discipline on echoed input);
# no-referrer keeps hub URLs out of outbound requests from Swagger UI links.
quarkus.http.filter.security.matches=/.*
quarkus.http.filter.security.methods=GET,HEAD,POST,PUT,DELETE,PATCH
quarkus.http.filter.security.header."X-Frame-Options"=DENY
quarkus.http.filter.security.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.security.header."Referrer-Policy"=no-referrer

# MCP Server Configuration (experimental)
# Gates MCP tool invocations. When false (the default), every @Tool method
# returns a disabled error; the /mcp HTTP endpoint itself remains reachable.
# Defaults to false. Override at runtime with -Dcalm.mcp.enabled=true or the
# environment variable CALM_MCP_ENABLED=true to enable all MCP tools.
calm.mcp.enabled=false
# Log every JSON-RPC message in dev mode for easier debugging of MCP clients.
%dev.quarkus.mcp.server.traffic-logging=true
quarkus.log.category."org.finos.calm".level=DEBUG
quarkus.log.category."org.mongodb.driver".level=OFF

# OpenTelemetry — disabled by default, enable via CALM_OTEL_ENABLED=true in production
quarkus.otel.service.name=${OTEL_SERVICE_NAME:calm-hub}
quarkus.otel.enabled=${CALM_OTEL_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${CALM_OTEL_SAMPLING_RATIO:1.0}
quarkus.micrometer.enabled=true
quarkus.micrometer.binder.http-server.enabled=${CALM_OTEL_METRICS_ENABLED:false}
quarkus.micrometer.binder.http-client.enabled=${CALM_OTEL_METRICS_ENABLED:false}


# Test profile: disable OTEL/Micrometer to avoid noise
%test.quarkus.otel.enabled=false
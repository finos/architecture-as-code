# OIDC profile — works with ANY compliant IdP (Entra ID, Keycloak, Okta, generic).
# Activate with: -Dquarkus.profile=oidc

# Auth enabled, OIDC token validation active
calm.auth.enabled=true
quarkus.oidc.tenant-enabled=true

# OIDC discovery — set these via environment variables
quarkus.oidc.auth-server-url=${CALM_OIDC_ISSUER_URL}
quarkus.oidc.client-id=${CALM_OIDC_CLIENT_ID}
quarkus.oidc.token.principal-claim=${CALM_OIDC_USERNAME_CLAIM:preferred_username}
# Validate token audience and issuer against the configured client/IdP
quarkus.oidc.token.audience=${CALM_OIDC_CLIENT_ID}
quarkus.oidc.token.issuer=${CALM_OIDC_ISSUER_URL}

# Frontend routing — tells the UI which OIDC library to load
calm.oidc.provider=${CALM_OIDC_PROVIDER:generic-oidc}
calm.oidc.scopes=${CALM_OIDC_SCOPES:openid profile email}

# GitHub storage backend (only relevant when calm.database.mode=github)
calm.github.service-token=${CALM_GITHUB_SERVICE_TOKEN:}
calm.github.clone-directory=${CALM_GITHUB_CLONE_DIR:/tmp/calm-hub-clones}
calm.github.sync-interval=${CALM_GITHUB_SYNC_INTERVAL:900}
calm.github.api-url=${CALM_GITHUB_API_URL:https://api.github.com}


# Map the "groups" claim from the ID token to SecurityIdentity roles
quarkus.oidc.roles.role-claim-path=groups

# Global fallback: semicolon-separated groups that grant access (used when namespace config has no groups)
calm.oidc.roles.access=${CALM_OIDC_ROLES_ACCESS:}


# Base URL for constructing callback URIs (override in production)
calm.hub.base-url=${CALM_HUB_BASE_URL:http://localhost:8080}

# Public endpoints (accessible before login or as full-page navigations)
quarkus.http.auth.permission.public.paths=/api/calm/auth/config,/api/calm/auth/plugin-login,/api/calm/auth/plugin-callback
quarkus.http.auth.permission.public.policy=permit

# Safety net — require authentication on all other API paths
quarkus.http.auth.permission.api.paths=/api/calm/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.calm.paths=/calm/*
quarkus.http.auth.permission.calm.policy=authenticated
quarkus.http.auth.permission.mcp-tools.paths=/mcp/*
quarkus.http.auth.permission.mcp-tools.policy=authenticated

# Dev-only CORS (SPA on Vite :5173 → Quarkus :8080)
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Authorization,Content-Type
%dev.quarkus.http.cors.access-control-allow-credentials=true

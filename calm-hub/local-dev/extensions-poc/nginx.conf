events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # The dev server sends hundreds of module files. Reuse connections to it.
    upstream hub_ui {
        # Docker Desktop's DNS gives host.docker.internal an IPv4 address. Do not map it with
        # extra_hosts host-gateway: that adds an IPv6 address that nginx cannot reach.
        # max_fails=0: a failure while the dev server starts must not take it out of use.
        server host.docker.internal:5180 max_fails=0;
        keepalive 32;
    }

    server {
        listen 8088;

        auth_basic "CALM Hub";
        auth_basic_user_file /etc/nginx/htpasswd;

        location / {
            proxy_pass http://hub_ui;
            proxy_http_version 1.1;
            # Vite accepts only known hosts.
            proxy_set_header Host localhost:5180;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Replaces any Remote-User header that the browser sends.
            proxy_set_header Remote-User $remote_user;
            proxy_set_header Authorization "";
        }
    }
}

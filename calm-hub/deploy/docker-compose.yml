# CALM Hub — local Docker Compose entry point.
#
# A single compose file with four profiles, one per published image variant:
#
#   jvm              (default)   finos/calm-hub:latest                  multi-arch (amd64, arm64)
#   native                       finos/calm-hub:latest-native           multi-arch (amd64, arm64)
#   readonly-static              finos/calm-hub:latest-read-only-static multi-arch (amd64, arm64), seeded NitriteDB baked in
#   readonly-native              finos/calm-hub:latest-read-only-native multi-arch (amd64, arm64), seeded NitriteDB baked in
#
# Selection:
#   docker compose up                          # uses .env default (jvm)
#   docker compose --profile native up
#   docker compose --profile readonly-static up
#   docker compose --profile readonly-native up
#
# All services bind 8080:8080 on the host; pick one profile at a time.
#
# The jvm and native profiles also start a MongoDB sidecar.  The readonly
# variants are self-contained (NitriteDB baked into the image).
#
#
# The MongoDB sidecar seeds the released meta-schemas from calm-hub/target/calm-schemas/release.
# Make it first, from the repository root: npm ci && npm run calm-hub:copy-schemas
# WARNING: jvm and native profiles use the `no-auth` Quarkus profile for local
# quick-start only.  DO NOT use in production — see calm-hub/README.md for the
# secure / proxy-auth profiles.
#
# The jvm and native profiles also run the extensions in calm-hub-extensions as sidecars: c4 (the C4 lens) and
# ea-layers (the Layers lens) of the Diagram tab. Each sidecar copies its extension folder into the calm-extensions
# volume, which Hub reads as calm.extensions.dir, and Hub calls it on the private network. Compose builds the
# sidecar images from source when they are not present. To run Hub without one, leave out its service and its
# calm.extensions settings of Hub, and remove the volume (docker compose down -v), which still holds its folder.

services:
  mongodb:
    image: mongo:latest
    container_name: calm_mongodb
    profiles: [jvm, native]
    ports:
      - "27017:27017"
    volumes:
      - ../mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ../target/calm-schemas/release:/calm-schemas/release:ro
    environment:
      - CALM_RELEASE_SCHEMA_PATH=/calm-schemas/release
    networks:
      - calm-net

  # Makes the key that Hub signs extension identity assertions with, once. The private key is readable by the
  # Hub container user: local quick-start only.
  calm-hub-keys:
    image: node:26-alpine
    profiles: [jvm, native]
    network_mode: none
    volumes:
      - calm-hub-keys:/keys
    command:
      - node
      - -e
      - |
        const fs = require('node:fs');
        if (!fs.existsSync('/keys/hub-private.pem')) {
          const { publicKey, privateKey } = require('node:crypto').generateKeyPairSync('ec', { namedCurve: 'P-256' });
          fs.writeFileSync('/keys/hub-public.pem', publicKey.export({ type: 'spki', format: 'pem' }), { mode: 0o644 });
          fs.writeFileSync('/keys/hub-private.pem', privateKey.export({ type: 'pkcs8', format: 'pem' }), { mode: 0o644 });
        }

  c4:
    image: finos/calm-hub-c4:latest
    build:
      context: ../..
      dockerfile: calm-hub-extensions/c4/Dockerfile
    container_name: calm-hub-c4
    profiles: [jvm, native]
    environment:
      - CALM_HUB_URL=http://hub:8080
      # The calm.hub.base-url of Hub, which Hub signs as the issuer.
      - CALM_HUB_ISSUER=http://localhost:8080
      - CALM_C4_EXPORT_DIR=/extensions
    volumes:
      - calm-extensions:/extensions
    networks:
      - calm-net

  ea-layers:
    image: finos/calm-hub-ea-layers:latest
    build:
      context: ../..
      dockerfile: calm-hub-extensions/ea-layers/Dockerfile
    container_name: calm-hub-ea-layers
    profiles: [jvm, native]
    environment:
      - CALM_HUB_URL=http://hub:8080
      - CALM_HUB_ISSUER=http://localhost:8080
      - CALM_EA_LAYERS_EXPORT_DIR=/extensions
    volumes:
      - calm-extensions:/extensions
    networks:
      - calm-net

  calmhub:
    image: finos/calm-hub:latest
    container_name: calm-hub
    profiles: [jvm]
    ports:
      - "8080:8080"
    environment:
      # no-auth is used here for the local quick-start only — DO NOT use in production.
      # For a production deployment select an appropriate auth profile (secure, proxy-auth).
      - >-
        JAVA_OPTS=-Dquarkus.mongodb.connection-string=mongodb://mongodb:27017 -Dquarkus.profile=no-auth
        -Dcalm.extensions.dir=/extensions
        -Dcalm.extensions.c4.backend-url=http://c4:8093 -Dcalm.extensions.c4.allow-http=true
        -Dcalm.extensions.ea-layers.backend-url=http://ea-layers:8094 -Dcalm.extensions.ea-layers.allow-http=true
        -Dcalm.extensions.identity.private-key-location=/keys/hub-private.pem
        -Dcalm.extensions.identity.public-key-locations=/keys/hub-public.pem
        -Dcalm.extensions.allow-without-auth=true
    volumes:
      - calm-extensions:/extensions:ro
      - calm-hub-keys:/keys:ro
    depends_on:
      calm-hub-keys:
        condition: service_completed_successfully
      c4:
        condition: service_healthy
      ea-layers:
        condition: service_healthy
    networks:
      calm-net:
        aliases: [hub]

  calmhub-native:
    image: finos/calm-hub:latest-native
    container_name: calm-hub-native
    profiles: [native]
    ports:
      - "8080:8080"
    # Native binaries do NOT read JAVA_OPTS; configure via Quarkus env vars.
    environment:
      - QUARKUS_MONGODB_CONNECTION_STRING=mongodb://mongodb:27017
      # Local demo only: disable auth so the UI works without an IdP.
      # WARNING: never run with auth disabled in production.
      - QUARKUS_PROFILE=no-auth
      - CALM_AUTH_ENABLED=false
      - CALM_EXTENSIONS_DIR=/extensions
      - CALM_EXTENSIONS__C4__BACKEND_URL=http://c4:8093
      - CALM_EXTENSIONS__C4__ALLOW_HTTP=true
      - CALM_EXTENSIONS__EA_LAYERS__BACKEND_URL=http://ea-layers:8094
      - CALM_EXTENSIONS__EA_LAYERS__ALLOW_HTTP=true
      - CALM_EXTENSIONS_IDENTITY_PRIVATE_KEY_LOCATION=/keys/hub-private.pem
      - CALM_EXTENSIONS_IDENTITY_PUBLIC_KEY_LOCATIONS=/keys/hub-public.pem
      - CALM_EXTENSIONS_ALLOW_WITHOUT_AUTH=true
    volumes:
      - calm-extensions:/extensions:ro
      - calm-hub-keys:/keys:ro
    depends_on:
      calm-hub-keys:
        condition: service_completed_successfully
      c4:
        condition: service_healthy
      ea-layers:
        condition: service_healthy
    networks:
      calm-net:
        aliases: [hub]

  calmhub-readonly-static:
    image: finos/calm-hub:latest-read-only-static
    container_name: calm-hub-readonly-static
    profiles: [readonly-static]
    ports:
      - "8080:8080"
    # Self-contained: NitriteDB baked into the image, mutating verbs return 405.
    networks:
      - calm-net

  calmhub-readonly-native:
    image: finos/calm-hub:latest-read-only-native
    container_name: calm-hub-readonly-native
    profiles: [readonly-native]
    ports:
      - "8080:8080"
    # Self-contained: NitriteDB baked into the image, mutating verbs return 405.
    networks:
      - calm-net

volumes:
  calm-extensions:
  calm-hub-keys:

networks:
  calm-net:
    driver: bridge

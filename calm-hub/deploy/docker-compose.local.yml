# Overlay for a locally built JVM Hub instead of finos/calm-hub:latest.
#
# From this directory, after `../mvnw package`:
#   docker compose --profile jvm -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# The gateway publishes HTTP 8080 and HTTPS 8443. Hub is only on the
# compose network. HTTP redirects to HTTPS.
# Calm Studio is https://localhost:8443/studio/ (also hub.creditas.cz).
#
# Mongo also mounts ../mongo/controls so init-mongo.js can seed controls
# (the published compose does not, and the seed script then exits the container).

services:
  mongodb:
    volumes:
      - ../mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ../../calm:/calm:ro
      - ../mongo/controls:/controls:ro
    environment:
      - CALM_CONTROLS_BASE_PATH=/controls
      - CALM_SCHEMA_BASE_PATH=/calm
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

  calmhub:
    image: calm-hub:latest
    pull_policy: never
    build:
      context: ..
      dockerfile: src/main/docker/Dockerfile.jvm
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # Applied at JVM start — no image rebuild needed. Matches application-no-auth CORS.
      # JAVA_OPTS replaces the base compose value (this image ignores JAVA_OPTS_APPEND).
      # Regex: localhost / 127.0.0.1 any port; *.creditasgroup.cz and *.creditas.cz http/https optional port.
      # Proxy flags so Hub sees the gateway's https scheme and host.
      - "JAVA_OPTS=-Dquarkus.mongodb.connection-string=mongodb://mongodb:27017 -Dquarkus.profile=no-auth -Dquarkus.http.cors.enabled=true -Dquarkus.http.cors.origins=/http:\\\\/\\\\/(localhost|127\\\\.0\\\\.0\\\\.1)(:\\\\d+)?/,/https?:\\\\/\\\\/([a-zA-Z0-9-]+\\\\.)*creditasgroup\\\\.cz(:\\\\d+)?/,/https?:\\\\/\\\\/([a-zA-Z0-9-]+\\\\.)*creditas\\\\.cz(:\\\\d+)?/ -Dquarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS -Dquarkus.http.cors.headers=accept,authorization,content-type -Dquarkus.http.proxy.proxy-address-forwarding=true -Dquarkus.http.proxy.allow-x-forwarded=true -Dquarkus.http.proxy.enable-forwarded-host=true -Dquarkus.http.proxy.trusted-proxies=0.0.0.0/0"
      - QUARKUS_HTTP_CORS_ENABLED=true
      - "QUARKUS_HTTP_CORS_ORIGINS=/http:\\/\\/(localhost|127\\.0\\.0\\.1)(:\\d+)?/,/https?:\\/\\/([a-zA-Z0-9-]+\\.)*creditasgroup\\.cz(:\\d+)?/,/https?:\\/\\/([a-zA-Z0-9-]+\\.)*creditas\\.cz(:\\d+)?/"

  gateway:
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/local-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/https-entrypoint.sh:/https-entrypoint.sh:ro
      - gateway-dev-certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/https-entrypoint.sh"]

volumes:
  gateway-dev-certs:

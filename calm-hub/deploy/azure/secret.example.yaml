# Example only. Do not commit a filled-in copy.
# Create the real secret with kubectl — see README.md.
#
# In-cluster Mongo (deploy/azure/mongodb) also needs mongodb-auth/root-password.
# External Mongo (Cosmos DB vCore, Atlas, or another replica set) only needs
# calm-hub-mongo/connection-string.
apiVersion: v1
kind: Secret
metadata:
  name: calm-hub-mongo
  namespace: calm-hub
type: Opaque
stringData:
  # Database name in the URI must be calmSchemas (QUARKUS_MONGODB_DATABASE).
  connection-string: mongodb://calmhub:REPLACE_PASSWORD@mongodb.calm-hub.svc.cluster.local:27017/calmSchemas?authSource=admin
---
apiVersion: v1
kind: Secret
metadata:
  name: calm-hub-bootstrap
  namespace: calm-hub
type: Opaque
stringData:
  # Entra object id of the first GLOBAL admin. Not the UPN.
  username: REPLACE_OBJECT_ID
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-auth
  namespace: calm-hub
type: Opaque
stringData:
  root-password: REPLACE_PASSWORD

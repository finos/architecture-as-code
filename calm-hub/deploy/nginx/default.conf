# One public port for the jvm profile.
# Hub stays at /. Calm Studio is the SPA under /studio/.

server {
    listen 8080;
    server_name _;
    client_max_body_size 32m;

    location = /studio {
        return 301 /studio/;
    }

    location /studio/ {
        proxy_pass http://calm-studio:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://calmhub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

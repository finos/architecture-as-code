# Local jvm gateway: HTTPS on 8443, HTTP on 8080 redirects there.
# Hub stays at /. Calm Studio is the SPA under /studio/.
# The certificate is generated on first start (see https-entrypoint.sh).

server {
    listen 8080;
    server_name _;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    client_max_body_size 32m;

    location = /studio {
        return 301 /studio/;
    }

    location /studio/ {
        proxy_pass http://calm-studio:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
    }

    location / {
        proxy_pass http://calmhub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_read_timeout 120s;
    }
}
